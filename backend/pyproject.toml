[project]
name = "inspirat-backend"
version = "0.1.0"
description = "API autoalojable de inspíraT"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.51",
  "alembic==1.16.4",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "PyJWT==2.10.1",
  "email-validator==2.2.0",
  "python-multipart==0.0.20",
  "redis==6.2.0",
  "boto3==1.39.10",
  "reportlab==4.4.2",
  "structlog==25.4.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
