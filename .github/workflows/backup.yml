name: Backup semanal de la base de datos
on:
  schedule:
    # Todos los domingos a las 08:00 UTC.
    - cron: "0 8 * * 0"
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Volcar la base de datos
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secret SUPABASE_DATABASE_URL en la configuración del repo." >&2
            exit 1
          fi
          pg_dump "$DATABASE_URL" -Fc > "inspirat-$(date +%F).dump"
      - name: Subir la copia como artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspirat-backup-${{ github.run_id }}
          path: inspirat-*.dump
          retention-days: 84
