name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e "./backend[dev]"
      - run: ruff check backend
      - run: pytest backend
      - run: docker compose config --quiet
      - run: docker build -t inspirat_backend:test backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build apk --debug --flavor dev --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: inspirat-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
