name: inspirat
description: "inspíraT — espacio privado de escritura offline-first."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.8.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon-512x512.png

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/branding/icon-512x512.png"
  min_sdk_android: 21
