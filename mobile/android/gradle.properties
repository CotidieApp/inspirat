org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Sin esto, el compilador de Kotlin revienta al cerrar sus caches
# incrementales cuando hay plugins con codigo Kotlin nativo (sentry_flutter,
# package_info_plus) y el build corre desde la unidad SUBST que usa
# scripts/build_android.ps1 para esquivar el bug de rutas no ASCII en
# Windows: la ruta real del paquete en el pub cache (C:\...) y la ruta SUBST
# del build (I:\...) no comparten raiz, y el compilador no puede relativizar
# entre ambas.
kotlin.incremental=false
